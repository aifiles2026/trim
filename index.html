<style>
/* ====== PALETA B · BOURNS TÉCNICO ====== */
:root{
  color-scheme: only light;
  --marino:#0B2545;
  --acero:#6B7A8F;
  --celeste:#1E88E5;
  --suave:#E9F1FB;
  --linea:#D6DEE9;
  --texto:#14233B;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#FFFFFF !important;color-scheme:only light;-webkit-text-size-adjust:100%}
body{
  background:#FFFFFF !important;color:var(--texto);min-height:100vh;
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;line-height:1.4;
}
.cond{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 40px;background:#FFFFFF}

header{background:#FFFFFF;padding:16px 16px 14px;border-top:8px solid var(--marino);border-bottom:1px solid var(--linea);margin-bottom:14px}
.cabeza{display:flex;align-items:center;gap:14px;max-width:828px;margin:0 auto;text-decoration:none}
.logo{width:60px;height:60px;border-radius:8px;flex:none;display:block}
.rotulo{display:block;border-left:2px solid var(--linea);padding-left:14px;min-width:0}
.marca{display:block;font-weight:800;font-size:clamp(34px,10vw,48px);letter-spacing:.04em;line-height:1;color:var(--marino)}
.sub{display:block;font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--acero);margin-top:4px}
.logo-pie{width:40px;height:40px;border-radius:6px;display:block;margin:0 auto 8px}
footer b{color:var(--marino)}
details.card summary{list-style:none;cursor:pointer;background:var(--marino);color:#FFFFFF;border-left:8px solid var(--celeste);padding:12px 14px;
  font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:19px;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";font-size:26px;line-height:.8;color:#9CC8F5}
details.card[open] summary::after{content:"–"}
details.card .pie{color:var(--acero);font-size:14px;border-top:1px solid var(--linea)}
.intro{margin:0 0 14px;border-radius:14px;overflow:hidden;border:1px solid var(--linea);background:#FFFFFF}
.intro video{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#0B2545}
.intro .pie-video{display:flex;justify-content:flex-end;padding:8px 10px;border-top:1px solid var(--linea)}
.sonido{border:none;border-radius:999px;background:var(--marino);color:#FFFFFF;padding:7px 13px;font:700 13px 'Barlow',Arial,sans-serif;letter-spacing:.04em;cursor:pointer}
.sonido:focus-visible{outline:3px solid var(--celeste);outline-offset:2px}
.promo{display:block;margin:0 0 14px;border-radius:14px;overflow:hidden;border:1px solid var(--linea)}
.promo img{display:block;width:100%;height:auto}
.hoja{width:22px;height:22px;flex:none;align-self:center}
.leyenda{display:flex;align-items:center;gap:6px;border-top:1px solid var(--linea);color:var(--acero);font-size:14px}
.leyenda .hoja{width:17px;height:17px}
ol.pasos{padding:14px 16px 14px 36px;background:#FFFFFF}
ol.pasos li{display:list-item;border:none;padding:5px 0;font-weight:500}

/* ---------- INICIO: botones ---------- */
.botones{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.bt{
  display:block;text-align:left;width:100%;cursor:pointer;text-decoration:none;
  background:#FFFFFF;border:2px solid var(--marino);border-left:8px solid var(--celeste);
  border-radius:14px;padding:14px 14px 13px;min-height:86px;color:var(--marino);
}
.bt b{display:block;font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:21px;letter-spacing:.05em;text-transform:uppercase;line-height:1.1}
.bt span{display:block;font-size:13.5px;color:var(--acero);margin-top:4px;font-weight:500}
.bt.grande{grid-column:1/-1;background:var(--marino);color:#FFFFFF;min-height:92px}
.bt.grande b{font-size:26px}
.bt.grande span{color:#C9D6E8}
.bt.oro{border-left-color:#C9A227}
.bt:focus-visible,.volver:focus-visible,.tab:focus-visible{outline:3px solid var(--celeste);outline-offset:2px}
@media(min-width:700px){.botones{grid-template-columns:1fr 1fr 1fr}}

/* ---------- SECCIONES ---------- */
.barra{display:flex;align-items:center;gap:12px;margin:6px 0 4px}
.volver{
  border:2px solid var(--marino);background:#FFFFFF;color:var(--marino);border-radius:10px;
  padding:8px 14px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap
}
h1{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:800;font-size:30px;color:var(--marino);text-transform:uppercase;letter-spacing:.03em;line-height:1.05}
.nota{color:var(--acero);font-size:14.5px;margin-top:8px}

.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:14px;border-bottom:3px solid var(--marino);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1 0 auto;min-width:84px;padding:10px 10px;border:2px solid var(--marino);border-bottom:none;border-radius:10px 10px 0 0;
  background:#FFFFFF;color:var(--marino);cursor:pointer;
  font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase
}
.tab[aria-selected="true"]{background:var(--marino);color:#FFFFFF}
.hoy{display:inline-block;background:var(--celeste);color:#FFFFFF;font-family:'Barlow',Arial,sans-serif;font-size:10px;font-weight:700;border-radius:9px;padding:1px 6px;margin-left:5px;vertical-align:middle;letter-spacing:.04em}

.card{background:#FFFFFF;border:1px solid var(--linea);border-radius:14px;margin-top:14px;overflow:hidden}
.card h2{background:var(--marino);color:#FFFFFF;border-left:8px solid var(--celeste);padding:9px 14px;
  font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:19px;letter-spacing:.12em;text-transform:uppercase}
.card ul{list-style:none;background:#FFFFFF}
.card li{padding:11px 16px;border-top:1px solid var(--linea);background:#FFFFFF;font-weight:500;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.card li:first-child{border-top:none}
.card.fuerte li{font-weight:600;font-size:17px;color:var(--marino)}
.card li small{display:block;color:var(--acero);font-weight:500;font-size:13.5px}
.precio{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:21px;color:var(--celeste);white-space:nowrap;text-align:right}
.precio s{display:block;font-family:'Barlow',Arial,sans-serif;font-size:12.5px;font-weight:500;color:var(--acero)}
ul.chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px}
ul.chips li{border:none;border-radius:999px;background:var(--suave);color:var(--marino);padding:7px 14px;font-size:15px}
.card p{padding:13px 16px;background:#FFFFFF}
.llamar{display:block;margin-top:14px;background:var(--celeste);color:#FFFFFF;text-align:center;text-decoration:none;border-radius:12px;padding:14px;
  font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:22px;letter-spacing:.1em;text-transform:uppercase}
.esp-hoy{border:2px solid var(--celeste)}
.esp-img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;background:#FFFFFF;border-bottom:1px solid var(--linea)}
.grid{display:grid;gap:0 14px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}.grid .full{grid-column:1/-1}}

footer{text-align:center;color:var(--acero);font-size:13px;margin-top:26px;padding-top:14px;border-top:1px solid var(--linea)}
</style>
</head>

/* VIDEO DE PORTADA — solo se muestra en la pantalla de inicio. Para quitarlo: const VIDEO = null; */
const VIDEO = null;

const BOTONES = [
  ["menu","Menú de la semana","Platos fuertes de lunes a sábado","grande"],
  ["especial","Especial del día","Un plato distinto cada día","grande"],
  ["desayunos","Combos desayuno","Precios con descuento",""],
  ["barra","Barra especial","Ensalada, sándwich, hamburguesa",""],
  ["postres","Postres y pedidos","Porciones y postres enteros",""],
  ["tickets","Repostería","Canjes con tickets",""],
  ["subsidio","Subsidio","Su beneficio en la cafetería",""],
  ["golden","Golden Ticket","Próximamente","oro"],
  ["eventos","Cumpleaños y eventos","Información de contacto",""],
  ["horarios","Horarios y avisos","Turnos y comunicados",""]
];

const jsDia = new Date().getDay();
const hoy = jsDia>=1 && jsDia<=DIAS.length ? jsDia-1 : -1;
let diaActivo = hoy>=0 ? hoy : 0;
const vista = document.getElementById("vista");
const e = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const titulo = id => BOTONES.find(b=>b[0]===id)[1];
const cab = (id,nota) => `<div class="barra"><a class="volver" href="#">← Inicio</a><h1>${e(titulo(id))}</h1></div>${nota?`<p class="nota">${e(nota)}</p>`:""}`;
const card = (t,html,cls="") => `<section class="card ${cls}"><h2>${e(t)}</h2>${html}</section>`;
const filas = arr => `<ul>${arr.map(([a,b,p,r])=>`<li><div>${e(a)}${b?`<small>${e(b)}</small>`:""}</div>${p?`<div class="precio">${e(p)}${r?`<s>Regular ${e(r)}</s>`:""}</div>`:""}</li>`).join("")}</ul>`;
const HOJA = `<svg class="hoja" viewBox="0 0 24 24" role="img" aria-label="Opción vegetariana"><path fill="#2E9B47" d="M20.5 3.5c-8.2-.6-13.9 2.2-15.6 7.4-1 3 .1 5.7 1.6 7.3l-2.7 2.7 1.3 1.3 2.7-2.7c1.7 1.4 4.4 2.4 7.3 1.4 5.2-1.8 7.4-8 5.4-16.4z"/><path fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" d="M8 16.5c2.3-4 5.3-6.7 9-8.5"/></svg>`;
const veg = x => / \*V$/.test(x);
const lista = arr => `<ul>${arr.map(x=>veg(x)?`<li><span>${e(x.slice(0,-3))}</span>${HOJA}</li>`:`<li>${e(x)}</li>`).join("")}</ul>` +
  (arr.some(veg)?`<p class="pie leyenda">${HOJA} Opción vegetariana</p>`:"");
const chips = arr => `<ul class="chips">${arr.map(x=>`<li>${e(x)}</li>`).join("")}</ul>`;

const VISTAS = {
  inicio(){
    return (VIDEO?`<div class="intro"><video src="${VIDEO.src}" poster="${VIDEO.poster}" autoplay muted loop playsinline preload="auto" aria-label="Video promocional CocinArte"></video><div class="pie-video"><button class="sonido" type="button">Activar sonido</button></div></div>`:"") + (PROMO?`<a class="promo" href="#menu" data-dia="${DIAS.indexOf(PROMO.dia)}"><img src="${PROMO.img}" alt="${e(PROMO.alt)}"></a>`:"") + `<div class="botones">${BOTONES.map(([id,t,s,c])=>`<a class="bt ${c}" href="#${id}"><b>${e(t)}</b>${s?`<span>${e(s)}</span>`:""}</a>`).join("")}</div>`;
  },
  menu(){
    const d = MENU[DIAS[diaActivo]];
    return cab("menu") +
      `<div class="tabs" role="tablist">${DIAS.map((x,i)=>`<button class="tab" role="tab" aria-selected="${i===diaActivo}" data-dia="${i}">${x}${i===hoy?'<span class="hoy">HOY</span>':""}</button>`).join("")}</div>
       <div class="grid">` +
      (d.especial?card("Especial del día",filas([[d.especial,"",d.precio||PRECIO_ESPECIAL]]),"fuerte full esp-hoy"):"") +
      [["fuertes","Platos fuertes",lista,"fuerte full"]]
        .filter(x=>d[x[0]] && d[x[0]].length).map(x=>card(x[1],x[2](d[x[0]]),x[3])).join("") + `</div>`;
  },
  especial(){
    return cab("especial") + ESPECIALES.map(([dia,plato,precio])=>{
      const esHoy = DIAS.indexOf(dia)===hoy;
      return `<section class="card fuerte ${esHoy?"esp-hoy":""}"><h2>${e(dia)}${esHoy?'<span class="hoy">HOY</span>':""}</h2>${ESPECIAL_IMG[dia]?`<img class="esp-img" src="${ESPECIAL_IMG[dia]}" alt="${e(plato)}" loading="lazy">`:""}<ul><li><div>${e(plato)}</div><div class="precio">${e(precio)}</div></li></ul></section>`;
    }).join("");
  },
  desayunos(){
    return cab("desayunos","Precios con descuento; el precio regular aparece debajo.") +
      card("Combos",filas(DESAYUNOS),"fuerte") + card("Arma tu combo: componentes",chips(COMPONENTES));
  },
  barra(){
    return cab("barra",BARRA.nota) + card("Opciones",filas(BARRA.opciones.map(([a,b])=>[a,b,BARRA.precio])),"fuerte");
  },
  postres(){
    return cab("postres") + card("Postres",filas(POSTRES.items),"fuerte") +
      `<a class="llamar" href="tel:+506${POSTRES.telefono.replace(/\D/g,"")}">Pedidos: ${e(POSTRES.telefono)}</a>`;
  },
  tickets(){
    return cab("tickets","Recibimos sus tickets.") + card("Canjes",filas(TICKETS.map(([a,b])=>[b,"",a])),"fuerte");
  },
  subsidio(){
    return cab("subsidio") + card(SUBSIDIO.titulo,`<p>${e(SUBSIDIO.texto)}</p>`) +
      card("Precios con subsidio",filas(SUBSIDIO.precios),"fuerte") +
      card("¿Sabía que…?",`<p>${e(SUBSIDIO.sabia)}</p>`) +
      card("Nuestros horarios de atención / Turnos",filas(HORARIOS.map(([a,b])=>[a,b]))) +
      `<a class="llamar" href="#menu">Conozca nuestro menú semanal</a>`;
  },
  golden(){
    return cab("golden") + card("Golden Ticket",GOLDEN.map(p=>`<p>${e(p)}</p>`).join(""));
  },
  eventos(){
    return cab("eventos","Para cumpleaños y eventos especiales, contáctenos:") +
      card("Contacto",filas([["Correo",EVENTOS_CORREO],["Teléfono",EVENTOS_TELEFONO]]),"fuerte") +
      `<a class="llamar" href="mailto:${EVENTOS_CORREO}">Escribir al correo</a>` +
      `<a class="llamar" href="tel:+506${EVENTOS_TELEFONO.replace(/\D/g,"")}">Llamar al ${e(EVENTOS_TELEFONO)}</a>`;
  },
  horarios(){
    return cab("horarios") + card("Horarios de atención",filas(HORARIOS.map(([a,b])=>[a,b])),"fuerte") + card("Avisos",filas(AVISOS));
  }
};

function pintar(){
  const id = location.hash.slice(1);
  vista.innerHTML = (VISTAS[id] || VISTAS.inicio)();
  const sel = vista.querySelector('.tab[aria-selected="true"]');
  if(sel && sel.scrollIntoView) sel.scrollIntoView({inline:"center",block:"nearest"});
  const v = vista.querySelector(".intro video");
  if(v){ v.muted = true; const pr = v.play(); if(pr && pr.catch) pr.catch(()=>{ v.controls = true; }); }
}
vista.addEventListener("click",ev=>{
  const pr = ev.target.closest(".promo");
  if(pr && +pr.dataset.dia>=0) diaActivo = +pr.dataset.dia;
  const so = ev.target.closest(".sonido");
  if(so){ const v = vista.querySelector(".intro video"); v.muted = !v.muted; if(!v.muted) v.play(); so.textContent = v.muted ? "Activar sonido" : "Silenciar"; return; }
  const t = ev.target.closest(".tab");
  if(t){ diaActivo = +t.dataset.dia; pintar(); }
});
window.addEventListener("hashchange",()=>{ pintar(); window.scrollTo(0,0); });
pintar();
</script>
</body>
</html>
